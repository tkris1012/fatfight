<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もちプー 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cocoa: #6E5462; --cocoa-l: #A48C98; --pink: #FF9EB8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    color: var(--cocoa);
    background: radial-gradient(120% 80% at 50% 20%, #FFFFFF 0%, #FDEEF3 45%, #EFE9FF 100%);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .title {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
  }
  .title b { display: block; font-size: 22px; font-weight: 900; letter-spacing: .04em; }
  .title span { font-size: 12px; color: var(--cocoa-l); }
  .panel {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(420px, calc(100% - 24px));
    background: rgba(255, 255, 255, .82); backdrop-filter: blur(10px);
    border-radius: 28px; padding: 14px 16px 16px;
    box-shadow: 0 12px 30px rgba(200, 140, 160, .22), inset 0 -4px 0 rgba(246, 210, 205, .4), inset 0 2px 0 #fff;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .label { font-size: 12px; font-weight: 700; color: var(--cocoa-l); width: 44px; flex: none; }
  .seg { flex: 1; display: flex; background: #F7ECEC; border-radius: 99px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700;
    color: var(--cocoa-l); padding: 7px 0; border-radius: 99px; cursor: pointer;
  }
  .seg button.on { background: #fff; color: var(--cocoa); box-shadow: 0 3px 8px rgba(220, 150, 160, .25); }
  input[type=range] { flex: 1; accent-color: var(--pink); }
  .tiny { font-size: 11px; color: var(--cocoa-l); width: 50px; text-align: center; flex: none; }
  .btns { display: flex; gap: 8px; }
  .btn {
    flex: 1; border: 0; font: inherit; font-weight: 900; font-size: 13px; cursor: pointer;
    padding: 10px 0; border-radius: 18px; color: var(--cocoa);
    background: linear-gradient(180deg, #FFE0E8, #FFC3D3);
    box-shadow: 0 6px 14px rgba(242, 124, 158, .25), inset 0 -4px 0 rgba(0, 0, 0, .06), inset 0 2px 0 rgba(255, 255, 255, .6);
  }
  .btn.lav { background: linear-gradient(180deg, #EEE8FF, #D8CCFF); box-shadow: 0 6px 14px rgba(169, 150, 242, .25), inset 0 -4px 0 rgba(0, 0, 0, .06), inset 0 2px 0 rgba(255, 255, 255, .6); }
  .select {
    flex: 1; font: inherit; font-size: 13px; font-weight: 700; color: var(--cocoa);
    padding: 8px 12px; border-radius: 14px; border: 0; background: #fff;
    box-shadow: inset 0 2px 4px rgba(210, 160, 170, .25);
  }
  .hint { text-align: center; font-size: 11px; color: var(--cocoa-l); margin-top: 8px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--cocoa-l); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">もちプーを こねこね中…</div>
<div id="stage"></div>
<div class="title"><b>もちプー 3D</b><span>ドラッグでくるっと回せるよ・タップでジャンプ</span></div>

<div class="panel">
  <div class="row">
    <span class="label">表情</span>
    <div class="seg" id="mood">
      <button data-v="normal" class="on">ふつう</button>
      <button data-v="happy">うれしい</button>
      <button data-v="worried">しょんぼり</button>
    </div>
  </div>
  <div class="row">
    <span class="label">体型</span>
    <span class="tiny">すっきり</span>
    <input type="range" id="plump" min="-1" max="1" step="0.01" value="0">
    <span class="tiny">まんまる</span>
  </div>
  <div class="row">
    <span class="label">おしゃれ</span>
    <select id="item" class="select">
      <option value="">なし</option>
      <option value="ribbon">ももいろリボン</option>
      <option value="flower">おはなピン</option>
      <option value="beret">ラベンダーベレー</option>
      <option value="crown">ちいさな王冠</option>
      <option value="star">おほしさまピン</option>
      <option value="sprout">ふたばちゃん</option>
      <option value="glasses">まんまるメガネ</option>
      <option value="cherry">さくらんぼピン</option>
      <option value="heart">ほっぺハート</option>
    </select>
  </div>
  <div class="row btns">
    <button class="btn lav" id="spin">くるくる回転</button>
    <button class="btn" id="export">GLBで保存</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script type="module" src="js/pet3d.js"></script>
</body>
</html>
